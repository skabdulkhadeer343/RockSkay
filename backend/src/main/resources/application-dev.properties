############################
# Cache --> Redis
############################
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.otp.length=6

# Email Verification
app.otp.policies.email-verification.ttl=15m
app.otp.policies.email-verification.resend-cooldown=60s
app.otp.policies.email-verification.max-attempts=5
app.otp.policies.email-verification.max-requests=5
app.otp.policies.email-verification.request-window=15m


# Password Reset (FORGOT_PASSWORD in enum)
app.otp.policies.password-reset.ttl=10m
app.otp.policies.password-reset.resend-cooldown=60s
app.otp.policies.password-reset.max-attempts=5
app.otp.policies.password-reset.max-requests=5
app.otp.policies.password-reset.request-window=15m

# Resume Download
app.otp.policies.resume-download.ttl=5m
app.otp.policies.resume-download.resend-cooldown=30s
app.otp.policies.resume-download.max-attempts=5
app.otp.policies.resume-download.max-requests=10
app.otp.policies.resume-download.request-window=15m

# Account Deletion
app.otp.policies.account-deletion.ttl=3m
app.otp.policies.account-deletion.resend-cooldown=60s
app.otp.policies.account-deletion.max-attempts=3
app.otp.policies.account-deletion.max-requests=3
app.otp.policies.account-deletion.request-window=15m

